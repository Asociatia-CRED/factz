.follow-btn{display:inline-flex; align-items:center; gap:6px; height:38px; padding:0 15px; border-radius:999px; border:2px solid #fff; background:rgba(255,255,255,.14); color:#fff; font-weight:800; font-size:.875rem; backdrop-filter:blur(6px); white-space:nowrap}

.art-media{max-width:1120px; margin:24px auto 0}
.art-media .cover{border-radius:24px; border:2px solid var(--edge); aspect-ratio:16/9}
.art-media figcaption{font-size:.8125rem; color:var(--ink-3); margin-top:8px; text-align:center}
.prose{max-width:680px; margin:32px auto 0; font-size:1.1875rem; line-height:1.72; color:var(--ink)}
.prose > :first-child{margin-top:0}
.prose p{margin:0 0 1.15em}
.prose h2{font-family:var(--display); font-size:1.7rem; line-height:1.1; letter-spacing:-.035em; font-weight:800; margin:1.7em 0 .5em}
.prose h3{font-family:var(--display); font-size:1.3rem; font-weight:700; letter-spacing:-.02em; margin:1.4em 0 .4em}
.prose a{color:var(--brand); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1.5px}
.prose blockquote{margin:1.6em 0; padding:18px 22px; border-radius:18px; background:var(--surface); border:2px solid var(--edge); font-family:var(--display); font-size:1.4rem; line-height:1.25; letter-spacing:-.02em; font-weight:600}
.prose ul, .prose ol{padding-left:1.3em; margin:0 0 1.15em}
.prose li{margin-bottom:.4em}
.prose li::marker{color:var(--brand); font-weight:800}
.prose figure{margin:1.8em 0}
.prose img, .prose video{border-radius:16px; width:100%}
.prose figcaption{font-size:.8125rem; color:var(--ink-3); margin-top:8px}
.prose hr{border:0; border-top:2px solid var(--line); margin:2em 0}
.op-note{max-width:680px; margin:24px auto 0; padding:12px 16px; border-radius:14px; background:var(--surface-2); font-size:.875rem; color:var(--ink-2)}
.art-foot{max-width:680px; margin:28px auto 0}
.live-feed{max-width:680px; margin:28px auto 0}
.live-h{display:flex; align-items:center; justify-content:space-between; gap:8px 12px; flex-wrap:wrap; margin-bottom:12px}
.sticker{max-width:100%; white-space:normal}
.live-h h2{font-family:var(--display); font-size:1.5rem; letter-spacing:-.03em; margin:0; font-weight:800}
.lu{position:relative; padding:14px 0 14px 22px; border-left:2px solid var(--line); margin-left:6px}
.lu::before{content:""; position:absolute; left:-7px; top:20px; width:12px; height:12px; border-radius:50%; background:var(--surface); border:2px solid var(--ink-3)}
.lu.key::before{background:var(--live); border-color:var(--live)}
.lu.key .lu-body{font-weight:600}
.lu time{font-size:.8125rem; font-weight:800; color:var(--ink-3); font-variant-numeric:tabular-nums}
.lu.key time{color:var(--live)}
.lu-body{margin-top:4px; font-size:1.0625rem; line-height:1.55; white-space:pre-wrap}
.lu-by{font-size:.75rem; color:var(--ink-3); margin-top:4px}
.reacts{margin-top:28px; padding:18px; border:2px solid var(--edge); border-radius:var(--r-tile); background:var(--surface)}
.reacts h3{margin:0 0 12px; font-family:var(--display); font-size:1.05rem; font-weight:800; letter-spacing:-.01em}
.react-row{display:flex; flex-wrap:wrap; gap:8px}
.react{display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); font-weight:700; font-size:.875rem; transition:transform .12s}
.react:hover{border-color:var(--edge)}
.react:active{transform:scale(.94)}
.react .e{font-size:1.15rem; line-height:1}
.react.mine{background:var(--lime); border-color:var(--lime-ink); color:var(--lime-ink)}
.react b{font-variant-numeric:tabular-nums}
.tags{display:flex; flex-wrap:wrap; gap:8px}
.trust{margin-top:24px; border:2px solid var(--edge); border-radius:var(--r-tile); background:var(--surface); overflow:hidden}
.trust-h{display:flex; align-items:center; gap:10px; padding:14px 20px; background:var(--ink); color:var(--paper); font-family:var(--display); font-weight:800; font-size:1.05rem}
.trust-h .logo-tick{width:24px; height:24px}
.trust dl{margin:0; padding:4px 20px 14px; display:grid; grid-template-columns:150px 1fr}
.trust dt, .trust dd{padding:10px 0; border-top:1.5px solid var(--line); margin:0; font-size:.9375rem}
.trust dt{color:var(--ink-3); font-weight:600}
.trust dl > :nth-child(1), .trust dl > :nth-child(2){border-top:0}
.rev{display:block; padding:6px 0}
.rev b{font-weight:700}
.rev.cor b{color:var(--danger)}
@media (max-width:560px){ .trust dl{grid-template-columns:1fr} .trust dd{border-top:0; padding-top:0} }
.comments{margin-top:40px}
.comments h2{font-family:var(--display); font-size:1.6rem; letter-spacing:-.035em; font-weight:800; margin:0 0 16px}
.cmt{padding:14px 16px; border-radius:16px; background:var(--surface); border:1.5px solid var(--line); margin-bottom:10px}
.cmt-h{display:flex; gap:10px; align-items:baseline; margin-bottom:4px; flex-wrap:wrap}
.cmt-h strong{font-size:.9375rem}
.cmt-h span{font-size:.8125rem; color:var(--ink-3)}
.cmt p{margin:0; font-size:.9875rem; line-height:1.55; white-space:pre-wrap}
.cmt.pending{opacity:.65; border-style:dashed}
.cmt-form{margin-top:18px; padding:18px; border-radius:var(--r-tile); border:2px solid var(--edge); background:var(--surface)}
.related{margin-top:48px; padding-top:26px; border-top:2px solid var(--edge)}

/* căutare */
.search-bar{display:flex; gap:10px; margin-bottom:14px}
.search-bar .input{font-size:1.2rem; padding:15px 20px; border:2px solid var(--edge); border-radius:999px}
.filters{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:24px}
.filters .field{min-width:0}
@media (max-width:400px){ .filters{grid-template-columns:1fr} }
@media (max-width:720px){ .filters{grid-template-columns:1fr 1fr} .search-bar .btn{display:none} }
mark{background:var(--lime); color:var(--lime-ink); border-radius:3px; padding:0 2px}

/* pagini statice */
.static{max-width:720px; margin:0 auto; padding-bottom:30px}
.static h2{font-family:var(--display); font-size:1.5rem; letter-spacing:-.03em; margin:1.6em 0 .4em; font-weight:800}
.static p, .static li{font-size:1.0625rem; line-height:1.65; color:var(--ink)}
.static a{color:var(--brand); text-decoration:underline}

/* subsol */
.site-foot{margin-top:56px; background:var(--ink); color:var(--paper); padding:44px 0 32px; border-radius:32px 32px 0 0}
.site-foot a:hover{text-decoration:underline}
.foot-big{overflow-wrap:break-word; font-family:var(--display); font-weight:800; font-size:clamp(2.4rem,1rem + 6vw,6.5rem); line-height:.88; letter-spacing:-.06em; margin:0 0 30px; font-variation-settings:"opsz" 96}
.foot-big span{color:var(--lime)}
.foot-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px}
.foot-grid h4{font-size:.8125rem; margin:0 0 10px; opacity:.6; font-weight:600}
.foot-grid ul{list-style:none; margin:0; padding:0; display:grid; gap:7px; font-size:.9375rem}
.socials{display:flex; gap:8px; flex-wrap:wrap}
.socials a{width:40px; height:40px; border-radius:50%; border:1.5px solid rgba(255,255,255,.25); display:grid; place-items:center}
.socials a:hover{background:var(--lime); color:var(--lime-ink); border-color:var(--lime)}
.socials svg{width:17px; height:17px}
.foot-note{margin-top:30px; font-size:.8125rem; opacity:.6; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
.foot-note button{background:none; border:0; padding:0; color:inherit; font:inherit; cursor:default}
@media (max-width:760px){ .foot-grid{grid-template-columns:1fr 1fr} }
.cookie{position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:50; max-width:560px; margin:0 auto; background:var(--surface); border:2px solid var(--edge); border-radius:20px; padding:14px 16px; display:flex; gap:12px; align-items:center; box-shadow:6px 6px 0 var(--shadow); font-size:.875rem}
.cookie a{text-decoration:underline}
@media (max-width:900px){ body.has-tabbar .cookie{bottom:calc(var(--navh) + 22px + env(safe-area-inset-bottom,0px))} }
.studio-fab{position:fixed; left:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:44; display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; background:var(--ink); color:var(--paper); font-weight:700; font-size:.8125rem; border:2px solid var(--edge); box-shadow:4px 4px 0 var(--lime)}
.studio-fab svg{width:16px; height:16px}
@media (max-width:900px){ body.has-tabbar .studio-fab{bottom:calc(var(--navh) + 22px + env(safe-area-inset-bottom,0px))} }

/* ---------- redacție (studio) ---------- */
.adm{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; min-height:100dvh}
.adm-side{min-width:0; background:var(--surface); border-right:1.5px solid var(--line); padding:20px 14px; position:sticky; top:0; height:100vh; height:100dvh; overflow-y:auto; display:flex; flex-direction:column; gap:4px}
.adm-side .logo{padding:0 8px 6px}
.adm-side .logo-word{font-size:1.45rem}
.studio-tag{margin:0 8px 16px; font-size:.75rem; font-weight:700; color:var(--ink-3)}
.adm-nav{display:flex; flex-direction:column; gap:2px}
.adm-nav a{display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:12px; color:var(--ink-2); font-weight:650; font-size:.9375rem}
.adm-nav a svg{width:19px; height:19px; flex:none}
.adm-nav a:hover{background:var(--surface-2); color:var(--ink)}
.adm-nav a.on{background:var(--ink); color:var(--paper)}
.adm-nav .badge{margin-left:auto}
.badge{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--live); color:#fff; font-size:.6875rem; font-weight:800}
.adm-me{margin-top:auto; padding:12px 6px 0; border-top:1.5px solid var(--line); display:flex; gap:8px; align-items:center}
.adm-me .avatar{width:34px; height:34px; font-size:.75rem; color:var(--ink)}
.adm-me > div{flex:1; min-width:0; line-height:1.25}
.adm-me strong{display:block; font-size:.875rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.adm-me span{font-size:.75rem; color:var(--ink-3)}
.adm-me .icon-btn{width:36px; height:36px}
.adm-main{padding:26px clamp(14px,3vw,40px) 64px; min-width:0}
.adm-top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px}
.adm-top h1{margin:0; font-family:var(--display); font-size:2rem; letter-spacing:-.04em; font-weight:800; line-height:1.05}
.adm-top p{margin:4px 0 0; color:var(--ink-2); font-size:.9375rem}
.adm-top .actions{display:flex; gap:8px; flex-wrap:wrap}
@media (max-width:1180px) and (min-width:901px){
  .adm{grid-template-columns:78px minmax(0,1fr)}
  .adm-side{padding:18px 10px; align-items:center}
  .adm-side .logo-word, .adm-side .logo-news, .studio-tag, .adm-side .fz-logo{display:none}
  .adm-side .fz-mark.l{display:block}
  [data-eff-theme="dark"] .adm-side .fz-mark.l{display:none}
  [data-eff-theme="dark"] .adm-side .fz-mark.d{display:block!important}
  .adm-side .logo{padding:0 0 18px}
  .adm-nav a{width:52px; height:48px; justify-content:center; padding:0; position:relative}
  .adm-nav a .nl{display:none}
  .adm-nav .badge{position:absolute; top:4px; right:2px; min-width:18px; height:18px}
  .adm-me{flex-direction:column; padding:10px 0 0}
  .adm-me > div{display:none}
}
@media (max-width:900px){
  .adm{grid-template-columns:minmax(0,1fr)}
  .adm-side{position:sticky; top:0; z-index:30; height:auto; flex-direction:row; align-items:center; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top,0px)); margin-top:calc(-1 * env(safe-area-inset-top,0px)); border-right:0; border-bottom:1.5px solid var(--line); overflow-x:auto; scrollbar-width:none; gap:6px}
  .adm-side::-webkit-scrollbar{display:none}
  .adm-side .logo{padding:0 6px 0 0}
  .adm-side .logo-news, .studio-tag{display:none}
  .adm-nav{flex-direction:row}
  .adm-nav a{white-space:nowrap; padding:8px 11px}
  .adm-nav a .nl{display:none}
  .adm-nav a.on .nl{display:inline}
  .adm-me{margin:0 0 0 auto; border:0; padding:0}
  .adm-me > div{display:none}
}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:22px}
.stat{background:var(--surface); border:2px solid var(--edge); border-radius:18px; padding:16px 18px}
.stat .n{font-family:var(--display); font-size:2.2rem; font-weight:800; letter-spacing:-.05em; line-height:1; font-variant-numeric:tabular-nums}
.stat .l{font-size:.8125rem; color:var(--ink-2); margin-top:6px; font-weight:600}
.stat a{display:block}
.stat.hl{background:var(--lime); color:var(--lime-ink); border-color:var(--lime-ink)}
.stat.hl .l{color:var(--lime-ink)}
.dash-grid{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:18px}
@media (max-width:1100px){ .dash-grid{grid-template-columns:minmax(0,1fr)} }
.card{background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:18px; margin-bottom:18px}
.card > h2, .card-h h2{font-family:var(--display); font-size:1.05rem; font-weight:800; letter-spacing:-.015em; margin:0 0 12px}
.card-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.card-h h2{margin:0}
.tbl-wrap{overflow-x:auto; background:var(--surface); border:1.5px solid var(--line); border-radius:18px}
table.tbl{width:100%; border-collapse:collapse; font-size:.9rem}
.tbl th{text-align:left; font-weight:700; color:var(--ink-3); font-size:.75rem; padding:12px 14px; border-bottom:1.5px solid var(--line); white-space:nowrap}
.tbl td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .t-title{font-weight:700; max-width:420px}
.tbl .t-title a:hover{color:var(--brand)}
.tbl .acts{display:flex; gap:4px; justify-content:flex-end; white-space:nowrap}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:.75rem; font-weight:700; white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.st-draft{background:var(--surface-2); color:var(--ink-2)}
.st-review{background:var(--warn-soft); color:var(--warn)}
.st-approved{background:var(--brand-soft); color:var(--brand-text)}
.st-scheduled{background:#EFE3FF; color:#7A2BD9}
[data-eff-theme="dark"] .st-scheduled{background:#2C1E47; color:#CDA8FF}
.st-published{background:var(--ok-soft); color:var(--ok-text)}
.st-off{background:var(--danger-soft); color:var(--danger-text)}
.tabs{display:flex; gap:4px; margin-bottom:16px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs a, .tabs button{border:1.5px solid var(--line); background:var(--surface); padding:7px 13px; border-radius:999px; font-weight:700; color:var(--ink-2); white-space:nowrap; font-size:.875rem}
.tabs .on{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.tabs .on .c{color:inherit; opacity:.85}
.tabs .c{font-size:.75rem; color:var(--ink-3); margin-left:5px; font-variant-numeric:tabular-nums}
.toolrow{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap}
.toolrow .input{max-width:320px}
.queue{list-style:none; margin:0; padding:0}
.queue li{display:flex; justify-content:space-between; gap:8px 12px; flex-wrap:wrap; padding:10px 0; border-top:1px solid var(--line); align-items:center}
.queue li > div:first-child{min-width:0; flex:1 1 180px}
.queue li:first-child{border-top:0; padding-top:0}
.queue a{font-weight:650}
.queue a:hover{color:var(--brand)}
.queue .sub{font-size:.8125rem; color:var(--ink-3)}
.bars{display:flex; align-items:flex-end; gap:10px; height:180px; padding-top:10px}
.bars .b{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end}
.bars .b i{display:block; width:100%; max-width:48px; background:var(--brand); border-radius:10px 10px 4px 4px; min-height:4px}
.bars .b.today i{background:var(--lime); border:2px solid var(--lime-ink)}
.bars .b small{font-size:.75rem; color:var(--ink-3)}
.bars .b b{font-size:.75rem; font-variant-numeric:tabular-nums}
.ed{display:grid; grid-template-columns:minmax(0,1fr) 350px; gap:22px; align-items:start}
@media (max-width:1180px){ .ed{grid-template-columns:1fr} }
.ed-main{background:var(--surface); border:1.5px solid var(--line); border-radius:22px; padding:clamp(16px,3vw,40px); min-width:0}
.ed-title{width:100%; border:0; background:transparent; font-family:var(--display); font-size:clamp(1.8rem,1.3rem + 1.8vw,2.8rem); font-weight:800; letter-spacing:-.04em; line-height:1.05; resize:none; padding:0; overflow:hidden; color:var(--ink)}
.ed-title:focus, .ed-dek:focus{outline:none}
.ed-dek{width:100%; border:0; background:transparent; font-size:1.2rem; color:var(--ink-2); resize:none; padding:0; margin-top:12px; overflow:hidden; line-height:1.5}
.ed-tldr{margin-top:16px; padding:14px; border-radius:16px; border:1.5px dashed var(--line); background:var(--paper)}
.ed-tldr .lbl{display:block; margin-bottom:8px}
.ed-tldr input{margin-bottom:6px}
.ed-bar{position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:2px; padding:8px 0; margin:18px 0 0; background:var(--surface); border-top:1.5px solid var(--line); border-bottom:1.5px solid var(--line)}
@media (max-width:900px){ .ed-bar{top:56px} }
.ed-bar button{border:0; background:none; min-width:36px; height:36px; border-radius:10px; color:var(--ink-2); display:grid; place-items:center; font-weight:800; font-size:.875rem; padding:0 8px}
.ed-bar button:hover{background:var(--surface-2); color:var(--ink)}
.ed-bar button svg{width:18px; height:18px}
.ed-bar .sep{width:1.5px; background:var(--line); margin:6px 4px}
.ed-body{min-height:340px; padding:22px 0 8px; margin:0; max-width:none}
.ed-body:focus{outline:none}
.ed-body:empty::before{content:attr(data-ph); color:var(--ink-3)}
.ed-side .card{padding:16px}
.wf-status{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.wf-steps{display:flex; gap:4px; margin-bottom:14px}
.wf-steps span{flex:1; height:5px; border-radius:3px; background:var(--surface-2)}
.wf-steps span.on{background:var(--brand)}
.wf-actions{display:grid; gap:8px}
.saved-at{font-size:.75rem; color:var(--ink-3); margin-top:10px; text-align:center}
.tag-input{display:flex; flex-wrap:wrap; gap:6px; padding:6px; border:1.5px solid var(--line); border-radius:var(--r-ui); background:var(--surface)}
.tag-input:focus-within{border-color:var(--brand); box-shadow:0 0 0 4px var(--brand-soft)}
.tag-input input{border:0; flex:1; min-width:120px; padding:4px 6px; background:transparent}
.tag-input input:focus{outline:none}
.tag-input .chip button{border:0; background:none; padding:0; color:inherit; font-size:1rem; line-height:1}
.media-pick{display:flex; gap:10px; align-items:center}
.media-pick .thumb{width:96px; aspect-ratio:16/10; border-radius:10px; overflow:hidden; background:var(--surface-2); flex:none; position:relative}
.media-pick .thumb img, .media-pick .thumb svg, .media-pick .thumb video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.media-pick .thumb > div{display:grid; place-items:center; height:100%; color:var(--ink-3)}
.media-pick .thumb > div svg{position:static; width:24px; height:24px}
.serp{border:1.5px solid var(--line); border-radius:12px; padding:12px; background:var(--paper); margin-top:6px}
.serp .u{font-size:.75rem; color:var(--ok)}
.serp .t{color:#1a0dab; font-size:1.05rem; line-height:1.3; margin:2px 0; font-weight:500}
[data-eff-theme="dark"] .serp .t{color:#8ab4f8}
.serp .d{font-size:.8125rem; color:var(--ink-2); line-height:1.45}
details.more > summary{cursor:pointer; font-family:var(--display); font-weight:800; font-size:1.05rem; list-style:none; display:flex; justify-content:space-between}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"+"; color:var(--ink-3)}
details.more[open] > summary::after{content:"−"}
details.more[open] > summary{margin-bottom:14px}
.lu-admin{padding:10px 0; border-top:1px solid var(--line); display:flex; gap:10px; align-items:flex-start}
.lu-admin > div{flex:1; min-width:0; font-size:.875rem; white-space:pre-wrap}
.lu-admin time{font-weight:800; font-size:.75rem; color:var(--ink-3); display:block}
.lu-admin.key time{color:var(--live)}
.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px}
.mitem{background:var(--surface); border:1.5px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; text-align:left; padding:0}
.mitem:hover{border-color:var(--edge)}
.mitem .th{aspect-ratio:4/3; background:var(--surface-2); display:grid; place-items:center; overflow:hidden}
.mitem .th img, .mitem .th video{width:100%; height:100%; object-fit:cover}
.mitem .th svg{width:28px; height:28px}
.mitem .mi{padding:8px 10px; font-size:.8125rem}
.mitem .mi strong{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mitem .mi span{color:var(--ink-3)}
.drop{border:2px dashed var(--line); border-radius:20px; padding:26px; text-align:center; color:var(--ink-2); margin-bottom:18px; transition:border-color .15s, background .15s}
.drop.over{border-color:var(--brand); background:var(--brand-soft)}
.swatch{width:18px; height:18px; border-radius:6px; display:inline-block; vertical-align:middle; border:1.5px solid var(--edge)}
.login{min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px}
.login-card{width:100%; max-width:420px}
.login-card .logo{margin-bottom:24px}
.login-card h1{font-family:var(--display); font-size:2.2rem; letter-spacing:-.045em; margin:0 0 6px; line-height:1}
.login-card > p{color:var(--ink-2); margin:0 0 22px}
.login-panel{background:var(--surface); border:2px solid var(--edge); border-radius:24px; padding:22px; box-shadow:6px 6px 0 var(--lime)}
.demo-box{margin-top:16px; padding:14px; border-radius:14px; background:var(--surface-2); font-size:.8125rem; color:var(--ink-2)}
.demo-box button{border:0; background:none; padding:2px 0; color:var(--brand); font-weight:700; font-size:.8125rem; text-align:left}
.demo-box ul{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:2px}
.notice{padding:12px 14px; border-radius:14px; background:var(--warn-soft); color:var(--warn); font-size:.875rem; margin-bottom:16px}
.notice.info{background:var(--brand-soft); color:var(--brand-text)}
.modal-bg{position:fixed; inset:0; background:rgba(8,6,20,.55); z-index:80; display:grid; place-items:center; padding:16px; animation:fade .15s ease-out}
.modal{background:var(--surface); border:2px solid var(--edge); border-radius:24px; width:100%; max-width:520px; max-height:calc(100dvh - 32px); overflow:auto; padding:22px; box-shadow:8px 8px 0 var(--shadow); animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.modal.wide{max-width:920px}
.modal h2{margin:0 0 14px; font-family:var(--display); font-size:1.45rem; letter-spacing:-.035em}
.modal .foot{display:flex; justify-content:flex-end; gap:8px; margin-top:18px; flex-wrap:wrap}
.radio-cards{display:grid; gap:8px; margin-bottom:14px}
.radio-cards label{display:flex; gap:10px; padding:12px 14px; border:1.5px solid var(--line); border-radius:14px; cursor:pointer; align-items:flex-start}
.radio-cards label:has(input:checked){border-color:var(--edge); background:var(--paper)}
.radio-cards input{margin-top:4px; accent-color:var(--brand)}
.radio-cards b{display:block}
.radio-cards span{font-size:.8125rem; color:var(--ink-3)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.97)}}
.toasts{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:99; display:grid; gap:8px; width:max-content; max-width:calc(100vw - 32px)}
.toast{background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:999px; font-size:.9rem; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:pop .2s ease-out; text-align:center}
.toast.err{background:var(--danger); color:#fff}
.loading{min-height:70vh; display:grid; place-items:center}
.spin{width:30px; height:30px; border:3px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2)); background-size:200% 100%; animation:sk 1.3s infinite; border-radius:var(--r-tile)}
@keyframes sk{to{background-position:-200% 0}}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}
  ::view-transition-old(root),::view-transition-new(root){animation:none}
}
</style>

<script>
"use strict";
/* ================= utilitare ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = (p = "") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const slugify = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 90);

function openModal(html, { wide = false, onMount } = {}) {
  const bg = document.createElement("div");

  bg.innerHTML = `<div class="modal${wide ? " wide" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  const prev = document.activeElement;
  const close = () => { if (!bg.isConnected) return; bg.remove(); document.removeEventListener("keydown", onKey); syncInert(); if (prev && prev.focus && document.contains(prev)) prev.focus(); };
  bg._close = close;

  document.addEventListener("keydown", onKey);

  syncInert();
  const m = bg.firstChild;

}

function hexToHsl(h) { let [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let hh = 0, s = 0; const l = (mx + mn) / 2; if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); hh = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; hh *= 60; } return [hh, s, l]; }

  const seed = hashStr(a.id || a.title || "x"), r = rng(seed);
  const [h, s] = hexToHsl(base);
  const pal = [base, hslToHex(h + 35 + r() * 25, Math.min(1, s + .1), .62), hslToHex(h - 40 - r() * 30, s, .5), hslToHex(h + 180, .9, .72)];

    const id = `g${seed.toString(36)}${i}`;

  });

  const deco = shape === 0 ? `<circle cx="${1100 + r() * 300}" cy="${260 + r() * 200}" r="${120 + r() * 80}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>`
    : shape === 1 ? `<path d="M-50 ${700 + r() * 150} Q 400 ${450 + r() * 200} 800 ${650 + r() * 100} T 1650 ${500 + r() * 200}" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>`

function pollBox() {

    ${(p.options || []).map(o => { const n = votes[o.id] || 0, pct = total ? Math.round(n / total * 100) : 0;
      return voted ? `<div class="poll-opt done ${voted === o.id ? "mine" : ""}"><div class="bar" style="width:${pct}%"></div><span><span>${esc(o.text)}</span><b>${pct}%</b></span></div>`

function newsletterBox(cls = "b-4") {

}
let trendRange = "azi";
function trendBox(all, cls = "b-4") {
  const days = trendRange === "azi" ? [dayKey(Date.now())] : [...Array(7)].map((_, i) => dayKey(Date.now() - i * 86400000));
  const score = trendRange === "react" ? a => reactScore(a.id, days) : a => days.reduce((s, d) => s + ((viewsOf(a.id).days || {})[d] || 0), 0);
  let list = all.map(a => ({ a, v: score(a) })).filter(x => x.v > 0).sort((x, y) => y.v - x.v).slice(0, 5);
  if (!list.length) list = all.slice(0, 5).map(a => ({ a, v: 0 }));
  return `<section class="tile trend ${cls}"><div class="tile-h"><h2>Trending</h2><div class="seg" role="group" aria-label="Interval"><button class="${trendRange === "azi" ? "on" : ""}" data-act="trend" data-r="azi">Azi</button><button class="${trendRange === "sapt" ? "on" : ""}" data-act="trend" data-r="sapt">7 zile</button><button class="${trendRange === "react" ? "on" : ""}" data-act="trend" data-r="react">Reacții</button></div></div>
    <ol>${list.map(({ a, v }) => `<li><div><a href="${artUrl(a)}">${esc(a.title)}</a>${v ? `<div class="v">${trendRange === "react" ? `${reactSummary(a.id).emoji} ${fmtNum(v)} reacții în ultimele 7 zile` : `${fmtNum(v)} citiri`}</div>` : ""}</div></li>`).join("")}</ol></section>`;
}
function storyItems() {
  const all = liveArts();
  const recent = all.filter(a => Date.now() - pubTime(a) < 3 * 86400000);
  return (recent.length >= 4 ? recent : all).filter(a => a.format !== "opinie").slice(0, 20);
}
// O bulă pe categorie, ca pe Instagram: toate știrile din aceeași categorie stau în aceeași bulă.
// Ordinea bulelor urmează cea mai nouă știre din fiecare categorie.
function storyGroups() {
  const groups = [], byKey = {};
  storyItems().forEach(a => {
    const k = a.categoryId || "_";
    if (!byKey[k]) { byKey[k] = { key: k, cat: catById(a.categoryId), items: [] }; groups.push(byKey[k]); }
    byKey[k].items.push(a);
  });
  return groups;
}
function storiesRow() {

    }).join("")}

function uniqueSlug(base, id) { let s = base || "articol", i = 2; while (Store.list("articles").some(x => x.slug === s && x.id !== id)) s = `${base}-${i++}`; return s; }
function revisionDialog() {
  return new Promise(res => {
    let done = false;
    openModal(`<h2>Ce fel de modificare e asta?</h2><form>
      <div class="radio-cards">
        <label><input type="radio" name="k" value="minor" checked><span><b>Minoră</b><span>Greșeli de tipar, formatare. Nu apare public.</span></span></label>
        <label><input type="radio" name="k" value="update"><span><b>Actualizare</b><span>Informații noi. Apare eticheta „Actualizat” și o notă în istoric.</span></span></label>
        <label><input type="radio" name="k" value="correction"><span><b>Corectură</b><span>Am greșit o informație. Apare eticheta „Corectat” și explicația.</span></span></label>
      </div>
      <div class="field" id="rv-note-f" hidden><label for="rv-note">Ce s-a schimbat? (vizibil pentru cititori)</label><textarea id="rv-note" class="input" rows="2" maxlength="280" placeholder="Ex.: Am corectat suma, care era de 2,1 milioane, nu 21 de milioane."></textarea></div>
      <div class="foot"><button type="button" class="btn sec" data-c>Anulează</button><button class="btn brand">Actualizează articolul</button></div></form>`, {
      onMount(m, cl) {
        const nf = m.querySelector("#rv-note-f");
        m.querySelectorAll('input[name="k"]').forEach(r => r.onchange = () => { nf.hidden = r.value === "minor" && r.checked; if (!nf.hidden) m.querySelector("#rv-note").focus(); });
        m.querySelector("[data-c]").onclick = () => { done = true; cl(); res(null); };
        m.querySelector("form").onsubmit = e => {
          e.preventDefault();
          const kind = m.querySelector('input[name="k"]:checked').value, note = m.querySelector("#rv-note").value.trim();
          if (kind !== "minor" && note.length < 5) { toast("Scrie pe scurt ce s-a schimbat.", true); return; }
          done = true; cl(); res({ kind, note });
        };
        const ob = new MutationObserver(() => { if (!document.body.contains(m)) { ob.disconnect(); if (!done) res(null); } });
        ob.observe(document.body, { childList: true });
      }
    });
  });
}
async function edSave(toStatus, extra = {}) {
  const u = me(); const a = edCollect();
  if (!a.title) { toast("Scrie un titlu înainte să salvezi.", true); $("#ed-title")?.focus(); return; }
  const target = toStatus || a.status;
  if (["review", "approved", "published", "scheduled"].includes(target)) {
    if (!a.categoryId) { toast("Alege o categorie.", true); return; }
    if (a.format !== "live" && textOf(a.body).trim().length < 40) { toast("Textul e prea scurt ca să meargă mai departe.", true); $("#ed-body")?.focus(); return; }
  }
  if (!toStatus && a.status === "published") {
    const rv = await revisionDialog(); if (!rv) return;
    a.revisions = [...(a.revisions || []), { at: Date.now(), kind: rv.kind, note: rv.note, by: u.id }].slice(-30);
  }
  a.slug = uniqueSlug(a.slug || slugify(a.title), a.id);
  a.readMin = readMinutes(a.body);
  a.updatedAt = Date.now();
  if (toStatus) {
    a.status = toStatus;
    if (toStatus === "approved") { a.approvedBy = u.id; a.approvedAt = Date.now(); }
    if (toStatus === "published") { a.publishedAt = Date.now(); a.approvedBy = a.approvedBy || u.id; a.publishAt = null; }
    if (toStatus === "draft") { a.publishedAt = null; a.publishAt = null; }
  }
  Object.assign(a, extra);
  for (const t of a.tags || []) if (!Store.get("tags", t)) await act(() => Store.set("tags", t, { name: t.replace(/-/g, " ") }));
  if (a.featured) for (const o of Store.list("articles").filter(x => x.featured && x.id !== a.id)) await act(() => Store.update("articles", o.id, { featured: false }));
  if (a.topicId && ["published", "scheduled"].includes(a.status) && Store.get("topics", a.topicId)) await act(() => Store.update("topics", a.topicId, { updatedAt: Date.now() }));
  const msgs = { review: "Trimis spre revizuire", approved: "Articol aprobat", published: "Publicat", scheduled: "Publicare programată", draft: "Mutat în ciorne" };
  const ok = await act(() => Store.set("articles", a.id, a), toStatus ? msgs[toStatus] : (a.status === "published" ? "Articol actualizat" : "Salvat"));
  if (!ok) return;
  ED.dirty = false; ED.savedAt = Date.now();
  if (ED.isNew) { ED.isNew = false; ignoreHash = true; location.hash = `${ST()}/editor/${a.id}`; }
  forceRender();
}

async function uploadFiles(files) {
  if (!CAP.assets) { toast("Încărcarea fișierelor necesită drept de editare pe acest site.", true); return []; }
  const out = [];
  for (const f of files) {
    const res = await act(async () => {
      const r = await CAP.assets.upload(f);
      const kind = r.contentType.startsWith("video/") ? "video" : r.contentType.startsWith("image/") ? "image" : "file";
      const m = { assetId: r.id, name: f.name, kind, type: r.contentType, size: r.sizeBytes, folder: "General", alt: "", createdAt: Date.now(), by: (me() || {}).id || "" };
      const id = newId("m"); await Store.set("media", id, m); return { ...m, id };
    });
    if (res && res !== true) out.push(res);
  }
  if (out.length) toast(out.length === 1 ? "Fișier încărcat" : `${out.length} fișiere încărcate`);
  return out;
}

/* ================= reacții în studio ================= */
function reactBreak(c) {
  const tot = REACTS.reduce((s, [k]) => s + (c[k] || 0), 0) || 1;
  return `<div class="rbreak">${REACTS.map(([k, e, l]) => { const n = c[k] || 0, pct = Math.round(n / tot * 100); return `<div class="rb-row"><span class="rb-e" title="${l}">${e}</span><span class="rb-bar"><i style="width:${pct}%"></i></span><b>${fmtNum(n)}</b></div>`; }).join("")}</div>`;
}
function reactPanel() {
  const arts = Store.list("articles").filter(isLive);
  const rows = arts.map(a => { const t = reactsToday(a.id); const n = Object.values(t).reduce((s, x) => s + x, 0); return { a, t, n }; }).filter(r => r.n > 0).sort((x, y) => y.n - x.n).slice(0, 6);
  const all = rows.reduce((s, r) => s + r.n, 0);
  const agg = {}; rows.forEach(r => Object.entries(r.t).forEach(([k, n]) => { agg[k] = (agg[k] || 0) + n; }));
  const topK = Object.entries(agg).sort((x, y) => y[1] - x[1])[0];
  const signal = r => { const sh = k => (r.t[k] || 0) / r.n; if (r.n >= 5 && sh("think") >= .3) return `<span class="rb-sig think">Mulți 🤔: poate merită explicat mai clar</span>`; if (r.n >= 5 && sh("angry") >= .3) return `<span class="rb-sig angry">Mult 😤: urmărește comentariile</span>`; return ""; };
  return `<div class="card"><div class="card-h"><h2>Reacțiile de azi</h2>${all ? `<span class="hint">${fmtNum(all)} reacții${topK ? `, cel mai des ${REACTS.find(r => r[0] === topK[0])[1]}` : ""}</span>` : ""}</div>
    ${rows.length ? `<ul class="queue">${rows.map(r => `<li style="align-items:flex-start"><div style="min-width:0"><a href="${ST()}/editor/${esc(r.a.id)}">${esc(r.a.title)}</a><div class="rb-inline">${REACTS.filter(([k]) => r.t[k]).map(([k, e]) => `<span>${e} ${fmtNum(r.t[k])}</span>`).join("")}</div>${signal(r)}</div><b style="white-space:nowrap">${fmtNum(r.n)}</b></li>`).join("")}</ul>`
      : `<p class="muted" style="margin:0">Nicio reacție azi încă. Cititorii pot reacționa din articol și din „Pe scurt”.</p>`}</div>`;
}

let ignoreHash = false, lastHash = location.hash, lastKey = "", rafId = 0;
function parseRoute() {
  const h = location.hash.replace(/^#/, "") || "/";

  return { parts: path.split("/").filter(Boolean).map(decodeURIComponent), q: new URLSearchParams(qs || "") };
}
function viewFor(r) {
  const [a, b, c] = r.parts;
  if (a && a === studioPath()) {
    const u = me();
    if (!u) return { html: pageLogin(), key: "login", admin: true };
    const V = (html, key, extra = {}) => ({ html, key, admin: true, ...extra });
    if (!b) return V(pageDash(), "dash");
    if (b === "articole") return V(pageArts(r.q), "arts");
    if (b === "editor") return V(pageEditor(c || "nou"), "editor:" + (c || "nou"), { editor: true });
    if (b === "media") return V(pageMedia(r.q), "media");
    const edOnly = { categorii: pageCats, comentarii: () => pageComments(r.q), sondaje: pagePolls, abonati: pageSubs, dosare: pageTopics, asistent: pageAgent };
    if (edOnly[b]) return isEd(u) ? V(edOnly[b](), b) : V(pageDash(), "dash");
    const adOnly = { utilizatori: pageUsers, setari: pageSettings };
    if (adOnly[b]) return isAdmin(u) ? V(adOnly[b](), b) : V(pageDash(), "dash");
    return V(pageDash(), "dash");
  }
  if (!a) return { html: pageHome(), key: "home" };
  if (a === "categorie") return { html: pageCategory(b), key: "cat:" + b };
  if (a === "articol") return { html: pageArticle(b), key: "art:" + b, article: b };
  if (a === "dosar") return { html: pageTopic(b), key: "topic:" + b };
  if (a === "cautare") return { html: pageSearch(r.q), key: "search" };
  if (a === "ultimele") return { html: pageLatest(), key: "latest" };
  if (a === "opinii") return { html: pageOpinions(), key: "opinii" };
  if (a === "salvate") return { html: pageSaved(), key: "saved" };
  if (a === "pentru-tine") return { html: pageForYou(), key: "foryou" };
  if (a === "tag") return { html: pageTag(b), key: "tag" };
  if (a === "autor") return { html: pageAuthor(b), key: "author" };
  if (a === "video") return { html: pageVideo(), key: "video" };
  if (a === "newsletter") return { html: pageNewsletterStatus(r.q.get("s")), key: "nl:" + r.q.get("s") };

}
function applyTheme() {

  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const eff = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-eff-theme", eff);
}
function render(navigated) {
  if (!Store.ready()) return;
  const r = parseRoute();
  const v = viewFor(r);
  if (navigated) { stopSpeak(); closeStories(); }
  const paint = () => {
    document.body.classList.toggle("has-tabbar", !v.admin);
    $("#app").innerHTML = v.html;
    lastKey = v.key;
    if (v.editor) edMount();
    if (navigated) { window.scrollTo(0, 0); const h = $("#main h1"); if (h && r.parts[0] !== studioPath()) { h.setAttribute("tabindex", "-1"); } }
    if (v.article) { const a = artBySlug(v.article); if (a && isLive(a)) { countView(a); if (navigated || readTarget !== a.id) { if (!isRead(a.id) || !streakData().readToday) startReadTracking(a); } } }
    else if (navigated) { clearTimeout(readTimer); readTarget = null; }
    $("#progress").hidden = !v.article;
  };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (navigated && document.startViewTransition && !reduce) document.startViewTransition(paint); else paint();
}
function forceRender() { const y = window.scrollY; lastKey = ""; render(false); window.scrollTo(0, y); }
function scheduleRender() {
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(() => {
    if (lastKey.startsWith("editor:")) { refreshEditorChrome(); return; }
    const ae = document.activeElement;
    if (ae && $("#app").contains(ae) && (ae.matches("input, textarea, select") || ae.isContentEditable) && ae.type !== "checkbox") {
      ae.addEventListener("blur", () => setTimeout(scheduleRender, 50), { once: true }); return;
    }
    if (document.querySelector(".modal-bg")) { setTimeout(scheduleRender, 400); return; }
    if ($$("#app video").some(v => !v.paused)) { setTimeout(scheduleRender, 3000); return; }
    const y = window.scrollY; render(false); window.scrollTo(0, y);
  });
}
function refreshEditorChrome() {

}
function autoGrow(el) { if (!el) return; el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

    lsSet("cred-session", { uid: u.id }); toast(`Bine ai venit, ${u.name.split(" ")[0]}`); forceRender();
  } else if (kind === "agent") {
    const sources = String(fd.get("sources") || "").split("\n").map(l => l.split("|").map(x => x.trim())).filter(x => x.length >= 2 && x[1]).map(([n, u]) => [n, /^https?:\/\//i.test(u) ? u : "https://" + u]).map(([name, url]) => ({ name: name.slice(0, 60) || "Sursă", url: url.slice(0, 400) })).slice(0, 25);
    if (!sources.length) { toast("Adaugă cel puțin o sursă, în formatul: Nume | https://adresa", true); return; }
    const conf = { enabled: !!fd.get("enabled"), photos: !!fd.get("photos"), maxPerDay: Math.max(1, Math.min(40, +fd.get("maxPerDay") || 10)), perRun: Math.max(1, Math.min(3, +fd.get("perRun") || 2)), categories: fd.getAll("cat").map(String), extra: String(fd.get("extra") || "").trim().slice(0, 800), sources };
    await act(() => Store.set("agent", "config", conf), "Setări salvate");
  } else if (kind === "bootstrap") {
    const name = String(fd.get("name") || "").trim(); if (!name) return;
    const btn = f.querySelector("button"); btn.disabled = true; btn.textContent = "Se configurează...";
    const ok = await act(async () => { await Store.apiWrite({ op: "bootstrap", name, demo: !!fd.get("demo") }); await Store.apiLoad(); }, "Gata! Ești administrator.");
    if (ok) forceRender(); else { btn.disabled = false; btn.textContent = "Creează contul de administrator"; }
  } else if (kind === "nl-test") {
    const email = String(fd.get("email") || "").trim(); const btn = f.querySelector("button"); if (btn) btn.disabled = true;
    try {
      const r = await fetch("/api/newsletter", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "test", email }) });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Testul nu a plecat.");
      if (j.status === "Succeeded") toast(`Azure a livrat e-mailul către ${email}. Dacă nu-l vezi, caută în Spam și Promoții.`);
      else if (j.status === "Running" || j.status === "Queued" || j.status === "NotStarted") toast(`Azure încă trimite e-mailul spre ${email}. Mai așteaptă un minut și verifică și în Spam.`);
      else throw new Error(`Azure nu a putut trimite e-mailul${j.error ? ": " + j.error : ""} (expeditor: ${j.from}).`);
    } catch (er) { toast(er.message, true); } finally { if (btn) btn.disabled = false; }
  } else if (kind === "settings") {
    const path = String(fd.get("studioPath") || "").trim().toLowerCase();
    if (!/^[a-z0-9-]{4,40}$/.test(path)) { toast("Adresa trebuie să aibă 4-40 de litere, cifre sau cratime.", true); return; }
    const reserved = ["categorie", "articol", "dosar", "cautare", "ultimele", "opinii", "salvate", "tag", "autor", "video", "despre", "contact", "termeni", "confidentialitate", "cookies", "accesibilitate", "newsletter", "pentru-tine"];
    if (reserved.includes(path)) { toast("Adresa asta e folosită deja de site. Alege alta.", true); return; }
    const social = {}; ["instagram", "tiktok", "youtube", "facebook", "x"].forEach(k => { const v = String(fd.get("so_" + k) || "").trim(); if (v) social[k] = v; });
    const changed = path !== studioPath();
    const ok = await act(() => Store.set("settings", "site", { ...settings(), studioPath: path, contactEmail: String(fd.get("contactEmail") || "").trim(), social }), "Setări salvate");
    if (ok && changed) { ignoreHash = true; location.hash = "#/" + path + "/setari"; toast("Noua adresă a studioului: #/" + path); }
  } else if (kind === "setup") {
    const id = newId("u");
    const ok = await act(() => Store.set("users", id, { name: String(fd.get("name")).trim(), email: String(fd.get("email")).trim().toLowerCase(), role: "admin", active: true, bio: "", createdAt: Date.now() }), "Cont de administrator creat");
    if (ok) { lsSet("cred-session", { uid: id }); setTimeout(forceRender, 300); }
  }
});

/* publicare automată a articolelor programate (vizibilitatea e oricum calculată la citire) */
async function promoteScheduled() {
  const u = me(); if (!u || !isEd(u)) return;
  for (const a of Store.list("articles").filter(x => x.status === "scheduled" && x.publishAt && x.publishAt <= Date.now()))
    await act(() => Store.update("articles", a.id, { status: "published", publishedAt: a.publishAt }));
}
setInterval(() => { if (Store.ready() && !lastKey.startsWith("editor:") && !lastKey.startsWith("art:")) scheduleRender(); promoteScheduled(); }, 60000);

/* ================= pornire ================= */
try { history.scrollRestoration = "manual"; } catch (e) {}
applyTheme();
Store.onChange(() => { if (!lastKey) render(true); else scheduleRender(); });
Store.init().then(() => setTimeout(promoteScheduled, 1500));
</script>
